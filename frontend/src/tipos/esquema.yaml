openapi: 3.0.3
info:
  title: API del Nodo SUBDERE
  version: desarrollo
  description: Catálogo de intercambios del dominio municipal, servicios y wiki.
paths:
  /api/v1/ambitos:
    get:
      operationId: ambitos_listar
      tags:
      - ambitos
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ambito'
          description: ''
  /api/v1/fuentes:
    get:
      operationId: fuentes_listar
      description: Las fuentes registradas. Registrar una la lee en el acto, aunque
        la lectura falle.
      tags:
      - fuentes
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fuente'
          description: ''
    post:
      operationId: fuentes_registrar
      description: Las fuentes registradas. Registrar una la lee en el acto, aunque
        la lectura falle.
      tags:
      - fuentes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fuente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fuente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fuente'
        required: true
      security:
      - realm: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fuente'
          description: ''
  /api/v1/fuentes/{id}:
    get:
      operationId: fuentes_ver
      description: 'Cambiar la dirección es el traspaso de custodia; `activa: false`,
        dar de baja la fuente.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - fuentes
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fuente'
          description: ''
    patch:
      operationId: fuentes_modificar
      description: 'Cambiar la dirección es el traspaso de custodia; `activa: false`,
        dar de baja la fuente.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - fuentes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFuente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFuente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFuente'
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fuente'
          description: ''
  /api/v1/fuentes/{id}/lecturas:
    get:
      operationId: fuentes_lecturas
      description: El historial de lecturas de una fuente, de la más reciente a la
        más antigua.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - fuentes
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lectura'
          description: ''
  /api/v1/fuentes/{id}/sincronizar:
    post:
      operationId: fuentes_sincronizar
      description: Vuelve a leer ahora. Responde con la lectura, válida o no.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - fuentes
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lectura'
          description: ''
  /api/v1/municipios:
    get:
      operationId: municipios_listar
      description: Las 346 comunas con su código CUT, de `core.Municipio`.
      tags:
      - municipios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MunicipioResumen'
          description: ''
  /api/v1/municipios/{cut}/encargado:
    put:
      operationId: municipios_designar_encargado
      description: Designa o reemplaza al encargado. El anterior queda como perfil
        común de su municipio.
      parameters:
      - in: path
        name: cut
        schema:
          type: string
        required: true
      tags:
      - municipios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignarEncargado'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DesignarEncargado'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DesignarEncargado'
        required: true
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/v1/municipios/{cut}/equipo:
    get:
      operationId: municipios_equipo
      description: El equipo de un municipio. El RUN, solo para quien lo administra.
      parameters:
      - in: path
        name: cut
        schema:
          type: string
        required: true
      tags:
      - municipios
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integrante'
          description: ''
  /api/v1/nodos:
    get:
      operationId: nodos_listar
      description: El catálogo. Sin sesión, solo lo publicado.
      parameters:
      - in: query
        name: ambito
        schema:
          type: string
        description: Nombre del ámbito
      - in: query
        name: clase
        schema:
          type: string
      - in: query
        name: intercambio
        schema:
          type: string
      - in: query
        name: madurez
        schema:
          type: string
      - in: query
        name: visibilidad
        schema:
          type: string
          enum:
          - oculto
          - publicado
          - retirado
          - todas
        description: Exige sesión. Sin el parámetro, solo los publicados.
      tags:
      - nodos
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodoResumen'
          description: ''
  /api/v1/nodos/{identificador}:
    get:
      operationId: nodos_ver
      description: La ficha de un nodo. La lee cualquiera si está publicado; la edita
        un curador.
      parameters:
      - in: path
        name: identificador
        schema:
          type: string
        required: true
      tags:
      - nodos
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nodo'
          description: ''
    patch:
      operationId: nodos_editar
      description: La ficha de un nodo. La lee cualquiera si está publicado; la edita
        un curador.
      parameters:
      - in: path
        name: identificador
        schema:
          type: string
        required: true
      tags:
      - nodos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNodoEditorial'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNodoEditorial'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNodoEditorial'
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nodo'
          description: ''
  /api/v1/nodos/{identificador}/especificacion:
    get:
      operationId: nodos_especificacion
      description: La especificación vigente del nodo, con las mismas reglas de visibilidad
        que el nodo.
      parameters:
      - in: path
        name: identificador
        schema:
          type: string
        required: true
      tags:
      - nodos
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especificacion'
          description: ''
  /api/v1/nodos/{identificador}/especificacion/archivo:
    get:
      operationId: nodos_especificacion_archivo
      description: El archivo tal como se leyó del repositorio, byte por byte.
      parameters:
      - in: path
        name: identificador
        schema:
          type: string
        required: true
      tags:
      - nodos
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: string
          description: ''
  /api/v1/perfiles:
    get:
      operationId: perfiles_listar
      description: 'Administradores: todos los perfiles. Encargados: los de su municipio.'
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
      - in: query
        name: municipio
        schema:
          type: string
        description: Código CUT
      - in: query
        name: rol
        schema:
          type: string
      tags:
      - perfiles
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfil'
          description: ''
    post:
      operationId: perfiles_crear
      description: 'Administradores: todos los perfiles. Encargados: los de su municipio.'
      tags:
      - perfiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Perfil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Perfil'
        required: true
      security:
      - realm: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/v1/perfiles/{id}:
    get:
      operationId: perfiles_ver
      description: 'Los perfiles no se borran: se desactivan con `activo: false`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - perfiles
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    patch:
      operationId: perfiles_modificar
      description: 'Los perfiles no se borran: se desactivan con `activo: false`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - perfiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/v1/salud:
    get:
      operationId: salud
      description: Responde si la API está arriba. Sin detalles de infraestructura
        ni de la base.
      tags:
      - salud
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
          description: ''
  /api/v1/servicios:
    get:
      operationId: servicios_listar
      description: Los servicios de nodos publicados, o los de un nodo. Los crea un
        curador.
      parameters:
      - in: query
        name: nodo
        schema:
          type: string
        description: Identificador o alias del nodo. Un oculto exige sesión.
      tags:
      - servicios
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servicio'
          description: ''
    post:
      operationId: servicios_crear
      description: Los servicios de nodos publicados, o los de un nodo. Los crea un
        curador.
      tags:
      - servicios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioNuevo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicioNuevo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicioNuevo'
        required: true
      security:
      - realm: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
          description: ''
  /api/v1/servicios/{slug}:
    get:
      operationId: servicios_ver
      description: Un servicio. Si su nodo no está publicado, solo con sesión.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - servicios
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
          description: ''
    patch:
      operationId: servicios_editar
      description: Un servicio. Si su nodo no está publicado, solo con sesión.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - servicios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServicioEditorial'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServicioEditorial'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServicioEditorial'
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
          description: ''
  /api/v1/servicios/cut/buscar:
    get:
      operationId: servicios_cut_buscar
      description: Busca por nombre en los tres niveles, sin tildes ni mayúsculas.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Al menos dos caracteres.
        required: true
      tags:
      - servicios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutBusqueda'
          description: ''
  /api/v1/servicios/cut/codigo/{codigo}:
    get:
      operationId: servicios_cut_codigo
      description: 'El camino inverso: de un código a la unidad territorial, con o
        sin ceros.'
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      tags:
      - servicios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutUnidad'
          description: ''
  /api/v1/servicios/permisos/{patente}:
    get:
      operationId: servicios_permisos
      description: El vehículo y sus permisos; una patente `PR` y cuatro dígitos,
        sus provisionales.
      parameters:
      - in: header
        name: X-Id-Tramite
        schema:
          type: string
      - in: header
        name: X-Procedimiento
        schema:
          type: string
        description: El trámite que motiva la consulta. Queda en el registro de accesos.
        required: true
      - in: query
        name: desde_anio
        schema:
          type: integer
        description: Solo para una patente definitiva.
      - in: path
        name: patente
        schema:
          type: string
        required: true
      tags:
      - servicios
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermisosRespuesta'
          description: ''
  /api/v1/wiki:
    get:
      operationId: wiki_listar
      description: El índice de la wiki, por sección y orden. Sin sesión, solo lo
        publicado.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - publicadas
          - todas
        description: '`todas` exige sesión e incluye las entradas sin publicar.'
      - in: query
        name: nodo
        schema:
          type: string
        description: Identificador o alias del nodo.
      tags:
      - wiki
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaResumen'
          description: ''
    post:
      operationId: wiki_crear
      description: El índice de la wiki, por sección y orden. Sin sesión, solo lo
        publicado.
      tags:
      - wiki
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNueva'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntradaNueva'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntradaNueva'
        required: true
      security:
      - realm: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaResumen'
          description: ''
  /api/v1/wiki/{slug}:
    get:
      operationId: wiki_ver
      description: Una entrada con su versión vigente. Sin versión publicada, 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - wiki
      security:
      - realm: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrada'
          description: ''
    patch:
      operationId: wiki_editar
      description: Una entrada con su versión vigente. Sin versión publicada, 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - wiki
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEntradaEditorial'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEntradaEditorial'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEntradaEditorial'
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaResumen'
          description: ''
  /api/v1/wiki/{slug}/versiones:
    get:
      operationId: wiki_versiones
      description: El historial de una entrada. Una edición es siempre una versión
        nueva, en borrador.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - wiki
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionResumen'
          description: ''
    post:
      operationId: wiki_versiones_crear
      description: El historial de una entrada. Una edición es siempre una versión
        nueva, en borrador.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - wiki
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionNueva'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VersionNueva'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionNueva'
        required: true
      security:
      - realm: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/wiki/{slug}/versiones/{version_id}:
    get:
      operationId: wiki_versiones_ver
      description: Una versión con su Markdown y su HTML.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: version_id
        schema:
          type: integer
        required: true
      tags:
      - wiki
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/wiki/{slug}/versiones/{version_id}/publicar:
    post:
      operationId: wiki_versiones_publicar
      description: Marca una versión como vigente. Publicar una antigua es volver
        atrás.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: version_id
        schema:
          type: integer
        required: true
      tags:
      - wiki
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/yo:
    get:
      operationId: yo
      description: El perfil propio. Es lo que el frontend pide al entrar para armar
        la interfaz.
      tags:
      - yo
      security:
      - realm: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
          description: ''
components:
  schemas:
    Acceso:
      type: object
      description: Agrupa campos planos del modelo como en la ficha. Nulo si la ficha
        no lo declara.
      properties:
        tipo:
          type: string
        detalle:
          type: string
      required:
      - detalle
      - tipo
    AccesoTipoEnum:
      enum:
      - abierto
      - credencial
      - clave-unica
      type: string
      description: |-
        * `abierto` - Abierto
        * `credencial` - Con credencial
        * `clave-unica` - Con Clave Única
    Ambiente:
      type: object
      properties:
        nombre:
          allOf:
          - $ref: '#/components/schemas/NombreEnum'
          readOnly: true
        base:
          type: string
          format: uri
          readOnly: true
        datos:
          allOf:
          - $ref: '#/components/schemas/DatosEnum'
          readOnly: true
      required:
      - base
      - datos
      - nombre
    Ambito:
      type: object
      properties:
        nombre:
          type: string
          readOnly: true
        orden:
          type: integer
          readOnly: true
      required:
      - nombre
      - orden
    BlankEnum:
      enum:
      - ''
    ClaseEnum:
      enum:
      - intercambio
      - plataforma
      type: string
      description: |-
        * `intercambio` - Intercambio
        * `plataforma` - Plataforma
    ComunaDelPermiso:
      type: object
      properties:
        cut:
          type: string
        nombre:
          type: string
      required:
      - cut
      - nombre
    ConsultaPermisos:
      type: object
