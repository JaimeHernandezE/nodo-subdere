# Instantánea ensamblada el 16 de septiembre de 2026 a partir del contrato seccionado
# del corpus SGM (versión 0.1.0). No es la fuente viva: si el corpus cambia, hay
# que volver a ensamblar. Solo se resolvieron $ref y se entrecomilló un escalar
# que el ensamblador no podía leer.
openapi: 3.1.0
info:
  title: SGM Adquisiciones API
  version: 0.1.0
  description: Contrato técnico del módulo Adquisiciones (piloto Compra Ágil). Vista funcional en `../contracts.md`. Rutas seccionadas por proceso transversal o modalidad; ensambladas aquí como punto de entrada único.
servers:
  - url: https://api.sgm.example/v1
    description: |
      Base URL de producción. Prefijo de tenant en ruta pendiente de resolver multitenancy (**[PENDIENTE P-03]**).
tags:
  - name: expediente
    description: Consultas del expediente y recursos asociados (solo lectura).
  - name: solped
    description: Solicitud de pedido (SOLPED) y trámite presupuestario.
  - name: modalidad-compra
    description: Ratificación de modalidad y vinculación con Mercado Público.
  - name: resolucion-compra-ca
    description: Resolución de compra — Compra Ágil.
  - name: resolucion-compra-cm
    description: Resolución de compra — Convenio Marco.
  - name: resolucion-compra-lp
    description: Resolución de compra — Licitación Pública.
  - name: resolucion-compra-td
    description: Resolución de compra — Trato Directo (rutas reutilizadas; ver fragmento 4-trato-directo).
  - name: recepcion-conforme
    description: Recepción conforme de bienes y servicios.
  - name: pago
    description: Cruce de 3 vías, devengado, decreto y ejecución de pago.
paths:
  /procurement-cases:
    get:
      operationId: listProcurementCases
      tags:
        - expediente
      summary: Listar expedientes de compra
      description: |
        Consulta paginada de expedientes. Solo lectura; sin efectos colaterales. Requiere scope `adquisiciones:read` (personas) o `adquisiciones.read` (M2M). Sub-paso 0.1 (`procesos-transversales/0-consulta-expedientes.md`). UI del listado: `page_size` = 50; encabezados ordenan con `sort` + `order`.
      x-subpasos:
        - '0.1'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          description: |
            Tamaño de página. En UI del listado 0.1 se usa 50 (máximo de pantalla; tope de plataforma 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          description: |
            Campo de orden del listado (encabezados de columna). Valores: folio, created_at, title, requesting_department, procurement_type, current_step, amount (`amount` = awarded_amount si existe; si no, requested_amount; `current_step` = current_step_id).
          schema:
            type: string
            enum:
              - folio
              - created_at
              - title
              - requesting_department
              - procurement_type
              - current_step
              - amount
        - $ref: '#/components/parameters/Order'
        - name: q
          in: query
          description: |
            Búsqueda libre en folio, título y etiqueta de modalidad (`procurement_type`).
          schema:
            type: string
        - name: procurement_type
          in: query
          schema:
            $ref: '#/components/schemas/ProcurementType'
        - name: status
          in: query
          description: |
            Filtro por estado del expediente (En curso / Cerrado / Anulado / Desierto). En UI 0.1 es un select; no se muestra como columna (la grilla muestra Paso).
          schema:
            $ref: '#/components/schemas/ProcurementCaseStatus'
        - name: requesting_department_id
          in: query
          description: |
            Filtra por departamento solicitante (incluye unidades hijas del departamento). Ignorado o rechazado si el rol fuerza scope de unidad (`adq.solicitante`, `adq.aprobador_unidad`).
          schema:
            type: string
        - name: requesting_unit_id
          in: query
          schema:
            type: string
        - name: folio
          in: query
          schema:
            type: string
        - name: awaiting_my_action
          in: query
          description: |
            Si es true, limita a expedientes que esperan acción del actor autenticado (por firmar / aprobar). Las pendientes detalladas por usuario se listan en la bandeja del sistema transversal de notificaciones (musts §9; plataforma/notificaciones).
          schema:
            type: boolean
      responses:
        '200':
          description: Colección paginada de expedientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProcurementCaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /procurement-cases/{case_id}:
    get:
      operationId: getProcurementCase
      tags:
        - expediente
      summary: Obtener detalle de expediente
      description: |
        Vista de expediente con paso actual resumido. Sub-paso 0.1 (navegación desde listado).
      x-subpasos:
        - '0.1'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Detalle del expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementCaseDetail'
              examples:
                ProcurementCaseAgile:
                  $ref: '#/components/examples/ProcurementCaseAgile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Expediente no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PROCUREMENT_CASE_NOT_FOUND
                field: case_id
                rule: El expediente no existe en el tenant del token
                severity: blocking
  /procurement-cases/{case_id}/steps:
    get:
      operationId: listProcurementCaseSteps
      tags:
        - expediente
      summary: Listar pasos del expediente
      description: Timeline de pasos ordenados por `step_number`.
      x-subpasos: []
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Pasos del expediente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseStep'
              examples:
                ProcurementCaseStepsAgile:
                  $ref: '#/components/examples/ProcurementCaseStepsAgile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Expediente no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PROCUREMENT_CASE_NOT_FOUND
                field: case_id
                rule: El expediente no existe en el tenant del token
                severity: blocking
  /purchase-requests/{id}:
    get:
      operationId: getPurchaseRequest
      tags:
        - expediente
      summary: Obtener detalle de SOLPED
      description: SOLPED con sus líneas de detalle.
      x-subpasos: []
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle de SOLPED con líneas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestWithLines'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SOLPED no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PURCHASE_REQUEST_NOT_FOUND
                field: id
                rule: La solicitud de pedido no existe
                severity: blocking
  /purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      tags:
        - expediente
      summary: Obtener detalle de orden de compra
      description: Detalle de una OC.
      x-subpasos: []
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle de orden de compra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Orden de compra no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PURCHASE_ORDER_NOT_FOUND
                field: id
                rule: La orden de compra no existe
                severity: blocking
  /purchase-requests/{id}/submit:
    post:
      operationId: submitPurchaseRequest
      tags:
        - solped
      summary: Enviar SOLPED a aprobación
      description: |
        Transiciona SOLPED completa a `pending_approval`. Exige campos obligatorios y resolución fundada si `purchase_modality = direct_procurement`. Ante varias reglas fallidas responde ValidationErrorResponse.
      x-subpasos:
        - '1.1'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: SOLPED enviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Una o más reglas de validación bloqueantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                submitMultipleRequired:
                  summary: Campos obligatorios faltantes al enviar a aprobación
                  value:
                    error_code: VALIDATION_FAILED
                    rule: La solicitud no cumple una o más reglas de validación
                    severity: blocking
                    issues:
                      - error_code: MISSING_REQUIRED_FIELD
                        field: requesting_unit
                        rule: El campo Unidad solicitante es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: destination_unit
                        rule: El campo Unidad de destino es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: title
                        rule: El campo Título es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: description
                        rule: El campo Descripción es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: justification
                        rule: El campo Justificación es obligatorio.
                        severity: blocking
                foundedResolution:
                  summary: Trato directo sin resolución fundada
                  value:
                    error_code: VALIDATION_FAILED
                    rule: La solicitud no cumple una o más reglas de validación
                    severity: blocking
                    issues:
                      - error_code: FOUNDED_RESOLUTION_REQUIRED
                        field: founded_resolution_attachment
                        rule: Trato directo requiere resolución fundada adjunta.
                        severity: blocking
  /purchase-requests/{id}/approve:
    post:
      operationId: approvePurchaseRequest
      tags:
        - solped
      summary: Aprobar SOLPED
      description: |
        Aprueba la SOLPED con firma electrónica válida. Emite evento `PurchaseRequestApproved`.
      x-subpasos:
        - '1.2'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: SOLPED aprobada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                signatureRequired:
                  value:
                    error_code: SIGNATURE_REQUIRED
                    rule: Se requiere firma electrónica válida (FirmaGob)
                    severity: blocking
                unauthorizedApprover:
                  value:
                    error_code: UNAUTHORIZED_APPROVER
                    rule: Solo el aprobador de jefatura de la unidad solicitante puede aprobar
                    severity: blocking
  /purchase-requests/{id}/reject:
    post:
      operationId: rejectPurchaseRequest
      tags:
        - solped
      summary: Rechazar SOLPED
      description: |
        Rechaza la SOLPED; `comments` obligatorio. Con `disposition = return_to_draft` (default) retorna a `draft` (editable en 1.1). Con `disposition = cancel` cierra el expediente (`ProcurementCase.status = cancelled`) sin corrección.
      x-subpasos:
        - '1.2'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionDecisionRequest'
      responses:
        '200':
          description: |
            SOLPED rechazada. Si `disposition = return_to_draft`, estado `draft`; si `disposition = cancel`, expediente cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /purchase-requests/{id}/budget-verification:
    post:
      operationId: verifyBudgetAvailability
      tags:
        - solped
      summary: Clasificar y verificar disponibilidad presupuestaria
      description: |
        Sub-paso 1.3 — clasificación DAF (cuenta × nodo hoja) y verificación de saldo (D-6). Prefill desde propuesta SOLPED; invoca `listManagementNodes` y `checkBudgetAvailability` (par `management_node_id` + `budget_line_id`). Persiste `imputation_diverged` si resuelto ≠ propuesto.
      x-subpasos:
        - '1.3'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetVerificationRequest'
      responses:
        '200':
          description: Verificación registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAvailabilityPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                budgetUnavailable:
                  $ref: '#/components/examples/BudgetUnavailableError'
                invalidStatus:
                  value:
                    error_code: INVALID_STATUS
                    rule: La SOLPED debe estar en estado pending_finance
                    severity: blocking
  /purchase-requests/{id}/budget-financing-request:
    post:
      operationId: requestBudgetFinancing
      tags:
        - solped
      summary: Solicitar financiamiento presupuestario
      description: |
        Paso optativo (1.4). Emite evento `BudgetFinancingRequested`; no avanza el ciclo principal hasta resolución externa.
      x-subpasos:
        - '1.4'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - justification
              properties:
                justification:
                  type: string
      responses:
        '202':
          description: Solicitud de financiamiento registrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /purchase-requests/{id}/budget-availability-certificate:
    post:
      operationId: issueBudgetAvailabilityCertificate
      tags:
        - solped
      summary: Emitir certificado de disponibilidad presupuestaria
      description: |
        Emite CDP firmado (modo electrónico o escaneado) sobre la imputación ya
        resuelta en 1.3 (`management_node_id` + `budget_line_id`). No reclasifica.
        Revalida saldo con `checkBudgetAvailability`. Emite `BudgetAvailabilityCertificateIssued`.
      x-subpasos:
        - '1.5'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBudgetCertificateRequest'
      responses:
        '201':
          description: CDP emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAvailabilityCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                verificationRequired:
                  value:
                    error_code: VERIFICATION_REQUIRED
                    rule: Debe existir verificación confirmada en sub-paso 1.3
                    severity: blocking
                segregation:
                  value:
                    error_code: SEGREGATION_OF_DUTIES_VIOLATION
                    rule: El verificador no puede ser el firmante del CDP
                    severity: blocking
                budgetUnavailable:
                  $ref: '#/components/examples/BudgetUnavailableError'
                signatureRequired:
                  value:
                    error_code: SIGNATURE_REQUIRED
                    rule: Se requiere firma electrónica válida (FirmaGob)
                    severity: blocking
                scannedInvalid:
                  value:
                    error_code: SCANNED_CDP_INVALID
                    rule: El adjunto escaneado del CDP no es válido
                    severity: blocking
  /purchase-requests/{id}/budget-availability-certificate/scanned:
    post:
      operationId: registerScannedBudgetAvailabilityCertificate
      tags:
        - solped
      summary: Registrar CDP escaneado
      description: |
        Modo degradado de emisión de CDP (1.5). Fija `signature_mode = scanned`.
      x-subpasos:
        - '1.5'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterScannedBudgetCertificateRequest'
      responses:
        '201':
          description: CDP escaneado registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAvailabilityCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                budgetUnavailable:
                  $ref: '#/components/examples/BudgetUnavailableError'
                scannedInvalid:
                  value:
                    error_code: SCANNED_CDP_INVALID
                    rule: El adjunto escaneado del CDP no es válido
                    severity: blocking
  /purchase-requests/{id}/budget-pre-commitment:
    post:
      operationId: createBudgetPreCommitment
      tags:
        - solped
      summary: Crear preobligación presupuestaria
      description: |
        Registra preobligación tras CDP vigente (1.6). Emite evento `BudgetPreCommitmentCreated`.
      x-subpasos:
        - '1.6'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetPreCommitmentRequest'
      responses:
        '201':
          description: Preobligación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPreCommitment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PurchaseRequestNotFound'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cdpRequired:
                  value:
                    error_code: CDP_REQUIRED
                    rule: Se requiere CDP vigente
                    severity: blocking
                budgetUnavailable:
                  $ref: '#/components/examples/BudgetUnavailableError'
                invalidStatus:
                  value:
                    error_code: INVALID_STATUS
                    rule: La SOLPED debe estar en estado pending_finance
                    severity: blocking
  /management-nodes:
    get:
      operationId: listManagementNodes
      tags:
        - solped
      summary: Listar nodos de gestión (eje Área › … › Actividad)
      description: |
        Catálogo cacheado desde Presupuestos (D-5). Usado en 1.1 como propuesta opcional y en 1.3 para clasificación obligatoria. No filtrar por unidad destino en 1.1 (P-23).
      x-subpasos:
        - '1.1'
        - '1.3'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: fiscal_year
          in: query
          schema:
            type: integer
        - name: leaves_only
          in: query
          description: Si true, solo nodos hoja imputables (default en UI de imputación).
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Nodos del ejercicio.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagementNodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /budget-lines/{id}/preview-availability:
    get:
      operationId: previewBudgetAvailability
      tags:
        - solped
      summary: Autoconsulta informativa de saldo
      description: |
        Consulta informativa de disponibilidad presupuestaria. No persiste ni afecta el estado de la SOLPED. Requiere RBAC de consulta sobre la línea.
      x-subpasos:
        - '1.1'
        - '1.2'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de imputación presupuestaria.
        - name: fiscal_year
          in: query
          required: true
          schema:
            type: integer
        - name: amount
          in: query
          description: Monto estimado de la SOLPED (opcional).
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Proyección de saldo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAvailabilityPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
