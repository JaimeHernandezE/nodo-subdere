        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: SIGNATURE_REQUIRED
                rule: Se requiere firma electrónica válida (FirmaGob)
                severity: blocking
  /payment-decrees/{id}/execute:
    post:
      operationId: executePayment
      tags:
        - pago
      summary: Ejecutar pago
      description: |
        Ejecuta el pago en Tesorería (5.4). Requiere idempotencia. Emite evento `PaymentCompleted`.
      x-subpasos:
        - '5.4'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador del decreto de pago.
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pago ejecutado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                treasuryUnavailable:
                  value:
                    error_code: TREASURY_PROVIDER_UNAVAILABLE
                    rule: El proveedor de tesorería no está disponible
                    severity: blocking
                paymentRejected:
                  value:
                    error_code: PAYMENT_REJECTED
                    rule: El pago fue rechazado por tesorería
                    severity: blocking
  /purchase-requests:
    get:
      operationId: listPurchaseRequests
      tags:
        - expediente
      summary: Listar solicitudes de pedido
      description: Consulta paginada de SOLPED.
      x-subpasos: []
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: procurement_case_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Colección paginada de SOLPED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPurchaseRequest
      tags:
        - solped
      summary: Crear solicitud de pedido
      description: |
        Registra una SOLPED en estado borrador. Valida campos obligatorios, cantidades, referencia de precio y resolución fundada si aplica.
      x-subpasos:
        - '1.1'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequestRequest'
      responses:
        '201':
          description: SOLPED creada en estado borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequest'
              examples:
                CreatePurchaseRequestSuccess:
                  $ref: '#/components/examples/CreatePurchaseRequestSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Regla(s) de negocio violada(s). Una sola regla → ErrorResponse; varias → ValidationErrorResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                missingFields:
                  value:
                    error_code: MISSING_REQUIRED_FIELD
                    field: title
                    rule: El campo Título es obligatorio.
                    severity: blocking
                invalidQuantity:
                  value:
                    error_code: INVALID_QUANTITY
                    field: lines[0].quantity
                    rule: La cantidad debe ser mayor a cero.
                    severity: blocking
                priceReference:
                  value:
                    error_code: PRICE_REFERENCE_UNAVAILABLE
                    field: lines[0].price_source
                    rule: No hay referencia de precio disponible para la línea.
                    severity: blocking
                priceDeviation:
                  value:
                    error_code: PRICE_DEVIATION_EXCEEDED
                    field: lines[0].unit_price
                    rule: La desviación de precio excede la tolerancia permitida.
                    severity: blocking
                foundedResolution:
                  value:
                    error_code: FOUNDED_RESOLUTION_REQUIRED
                    field: founded_resolution_attachment
                    rule: Trato directo requiere resolución fundada adjunta.
                    severity: blocking
                multipleRequired:
                  summary: Varias reglas bloqueantes (ValidationErrorResponse)
                  value:
                    error_code: VALIDATION_FAILED
                    rule: La solicitud no cumple una o más reglas de validación
                    severity: blocking
                    issues:
                      - error_code: MISSING_REQUIRED_FIELD
                        field: requesting_unit
                        rule: El campo Unidad solicitante es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: destination_unit
                        rule: El campo Unidad de destino es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: title
                        rule: El campo Título es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: description
                        rule: El campo Descripción es obligatorio.
                        severity: blocking
                      - error_code: MISSING_REQUIRED_FIELD
                        field: justification
                        rule: El campo Justificación es obligatorio.
                        severity: blocking
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags:
        - expediente
      summary: Listar órdenes de compra
      description: Consulta paginada de órdenes de compra.
      x-subpasos: []
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: procurement_case_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Colección paginada de órdenes de compra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerPersonas:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Plano personas (Clave Única). P-02 pendiente.
    bearerM2M:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Plano sistemas M2M (OAuth2 client credentials). P-02 pendiente.
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        example: ADQ-2026-00123
      description: Identificador del expediente (= folio `ADQ-AAAA-NNNNN`).
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: UNAUTHENTICATED
            rule: Token de autenticación inválido o ausente
            severity: blocking
    Forbidden:
      description: Sin permisos suficientes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: FORBIDDEN
            rule: El token no tiene scope suficiente para esta operación
            severity: blocking
    UnprocessableEntity:
      description: Regla de negocio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProcurementCaseNotFound:
      description: Expediente no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PROCUREMENT_CASE_NOT_FOUND
            field: id
            rule: El expediente no existe en el tenant del token
            severity: blocking
    PurchaseRequestNotFound:
      description: SOLPED no encontrada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PURCHASE_REQUEST_NOT_FOUND
            field: id
            rule: La solicitud de pedido no existe
            severity: blocking
  schemas:
    ProcurementType:
      type: string
      enum:
        - agile_purchase
        - framework_agreement
        - public_tender
        - direct_procurement
    ProcurementCaseStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelled
        - deserted
    CaseStepStatus:
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - omitted
    PurchaseRequestStatus:
      type: string
      enum:
        - draft
        - pending_approval
        - pending_finance
        - quoting_in_progress
        - quote_void
    PurchaseModality:
      type: string
      enum:
        - agile_purchase
        - framework_agreement
        - public_tender
        - direct_procurement
    DocumentCurrency:
      type: string
      enum:
        - CLP
        - UF
        - UTM
        - USD
      default: CLP
      description: |
        Moneda del documento SOLPED. Todas las líneas se expresan en ella; no se mezclan monedas en una misma solicitud. Default CLP.
    LineTaxCode:
      type: string
      enum:
        - iva_19
        - exempt
        - other
      default: iva_19
      description: |
        Código de impuesto por línea. El precio unitario es siempre neto; el sistema calcula el impuesto. Permite mezclar afectas y exentas. Catálogo ampliable (retenciones, tasas especiales) — pendiente.
    PurchaseRequestAttachmentType:
      type: string
      enum:
        - quote
        - product_reference_photo
        - technical_sheet
        - other
      description: |
        Cotización, foto referencial del producto, ficha técnica u otro antecedente de respaldo de la SOLPED.
    SignatureMode:
      type: string
      enum:
        - electronic
        - scanned
    ReceiptType:
      type: string
      enum:
        - physical_good
        - service
    GoodsReceiptStatus:
      type: string
      enum:
        - draft
        - confirmed
        - rejected
        - partially_rejected
    MatchStatus:
      type: string
      enum:
        - matched
        - discrepancy
    PaymentStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
    ProcurementCase:
      type: object
      required:
        - id
        - folio
        - title
        - requesting_unit_id
        - destination_unit_id
        - status
        - current_step_id
        - created_at
      properties:
        id:
          type: string
          example: ADQ-2026-00123
        folio:
          type: string
          example: ADQ-2026-00123
        title:
          type: string
          description: Título corto del expediente (copia de PurchaseRequest.title)
        requesting_unit_id:
          type: string
          description: Unidad que tramita (RoleAssignment del actor)
        destination_unit_id:
          type: string
          description: Unidad beneficiaria de la compra (base de listado/alcance de unidad)
        procurement_type:
          $ref: '#/components/schemas/ProcurementType'
        status:
          $ref: '#/components/schemas/ProcurementCaseStatus'
        current_step_id:
          type: string
        created_at:
          type: string
          format: date-time
        mp_process_id:
          type: string
          nullable: true
        mp_linked_at:
          type: string
          format: date-time
          nullable: true
        mp_process_type:
          type: string
          nullable: true
    ProcurementCaseSummary:
      type: object
      required:
        - id
        - folio
        - title
        - status
        - requesting_unit_id
        - destination_unit_id
        - created_at
      properties:
        id:
          type: string
        folio:
          type: string
        title:
          type: string
          description: Título corto del expediente (listado / cabecera)
        procurement_type:
          $ref: '#/components/schemas/ProcurementType'
        status:
          $ref: '#/components/schemas/ProcurementCaseStatus'
        current_step_id:
          type: string
          nullable: true
          description: Identificador del sub-paso actual (ej. 2.1)
          example: '2.1'
        current_step_name:
          type: string
          nullable: true
          description: Nombre del sub-paso actual
          example: Ratificación o selección de modalidad
        current_stage_label:
          type: string
          nullable: true
          description: |
            Etiqueta de la etapa (ej. Modalidad de Compra). La columna Paso del listado combina `{n} — {current_stage_label} / {current_step_id} {current_step_name}`.
          example: Modalidad de Compra
        requesting_unit_id:
          type: string
        destination_unit_id:
          type: string
          description: Unidad beneficiaria — columna Departamento / filtro de alcance unidad
        created_at:
          type: string
          format: date-time
        requested_amount:
          type: number
          description: |
            Total bruto solicitado (CLP): suma de líneas de PurchaseRequest / BudgetPreCommitment.estimated_amount. Ausente si aún no hay SOLPED con monto.
          nullable: true
        awarded_amount:
          type: number
          description: |
            Monto adjudicado/contratado (CLP) cuando existe PurchaseOrder activa (total_amount) o Contract.amount. Ausente antes de adjudicación/OC.
          nullable: true
    CaseStepSummary:
      type: object
      required:
        - id
        - step_number
        - name
        - status
      properties:
        id:
          type: string
        step_number:
          type: number
        name:
          type: string
        status:
          $ref: '#/components/schemas/CaseStepStatus'
        elapsed_display:
          type: string
    ProcurementCaseDetail:
      allOf:
        - $ref: '#/components/schemas/ProcurementCase'
        - type: object
          required:
            - current_step
          properties:
            current_step:
              $ref: '#/components/schemas/CaseStepSummary'
    CaseStep:
      type: object
      required:
        - id
        - procurement_case_id
        - step_number
        - name
        - status
      properties:
        id:
          type: string
        procurement_case_id:
          type: string
        step_number:
          type: number
        name:
          type: string
        status:
          $ref: '#/components/schemas/CaseStepStatus'
        responsible_unit_id:
          type: string
          nullable: true
        responsible_role:
          type: string
          nullable: true
        responsible_user_id:
          type: string
