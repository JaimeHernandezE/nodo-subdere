        - recepcion-conforme
      summary: Confirmar recepción conforme
      description: |
        Confirma o rechaza la recepción (4.2). Emite eventos `GoodsReceiptConfirmed` o `ReceiptRejected`.
      x-subpasos:
        - '4.2'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la recepción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmReceiptRequest'
      responses:
        '200':
          description: Recepción confirmada o rechazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                segregation:
                  value:
                    error_code: SEGREGATION_OF_DUTIES_VIOLATION
                    rule: El confirmante no puede ser el aprobador de la compra
                    severity: blocking
                missingAttachments:
                  value:
                    error_code: MISSING_REQUIRED_ATTACHMENTS
                    rule: Faltan adjuntos obligatorios (factura, guía de despacho)
                    severity: blocking
                signatureRequired:
                  value:
                    error_code: SIGNATURE_REQUIRED
                    rule: Se requiere firma electrónica válida
                    severity: blocking
  /goods-receipt-lines/{id}/inventory-entry:
    post:
      operationId: registerInventoryEntry
      tags:
        - recepcion-conforme
      summary: Registrar ingreso a inventario
      description: |
        Dependencia externa de inventario (4.3). Alcance pendiente (**[PENDIENTE P-44]**).
      x-subpasos:
        - '4.3'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de línea de recepción.
      responses:
        '202':
          description: Ingreso a inventario solicitado al proveedor externo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /goods-receipts/{id}/accrual:
    post:
      operationId: recordAccrual
      tags:
        - recepcion-conforme
      summary: Registrar devengado desde recepción conforme
      description: |
        Devengado asíncrono tras conformidad de recepción (4.4). Emite evento `AccrualRecorded`.
      x-subpasos:
        - '4.4'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la recepción.
      responses:
        '202':
          description: Devengado en proceso de registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accrual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: ACCRUAL_EXCEEDS_COMMITMENT
                rule: El monto devengado excede el compromiso presupuestario
                severity: blocking
  /purchase-orders/{id}/three-way-match:
    post:
      operationId: performThreeWayMatch
      tags:
        - pago
      summary: Ejecutar cruce de 3 vías
      description: |
        Cruza OC, recepción conforme y factura SII (5.1). Emite evento `ThreeWayMatchCompleted`.
      x-subpasos:
        - '5.1'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Cruce de 3 vías ejecutado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeWayMatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Orden de compra no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PURCHASE_ORDER_NOT_FOUND
                field: id
                rule: La orden de compra no existe
                severity: blocking
        '422':
          description: Regla(s) de negocio violada(s). Una sola regla → ErrorResponse; varias → ValidationErrorResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                goodsReceiptRequired:
                  value:
                    error_code: GOODS_RECEIPT_REQUIRED
                    field: goods_receipt_id
                    rule: Se requiere recepción conforme para el cruce de 3 vías.
                    severity: blocking
                invoiceUnavailable:
                  value:
                    error_code: INVOICE_PROVIDER_UNAVAILABLE
                    rule: El proveedor de facturas / SII no está disponible.
                    severity: blocking
                matchDiscrepancy:
                  value:
                    error_code: MATCH_DISCREPANCY
                    rule: Hay discrepancia entre OC, recepción y factura.
                    severity: blocking
                matchMultiple:
                  summary: Varias reglas del cruce (ValidationErrorResponse)
                  value:
                    error_code: VALIDATION_FAILED
                    rule: La solicitud no cumple una o más reglas de validación
                    severity: blocking
                    issues:
                      - error_code: MISSING_REQUIRED_FIELD
                        field: invoice_number
                        rule: El campo Número de factura es obligatorio.
                        severity: blocking
                      - error_code: GOODS_RECEIPT_REQUIRED
                        field: goods_receipt_id
                        rule: Se requiere recepción conforme para el cruce de 3 vías.
                        severity: blocking
  /three-way-matches/{id}/accrual:
    post:
      operationId: registerAccrual
      tags:
        - pago
      summary: Registrar devengado desde cruce de 3 vías
      description: |
        Registra devengado tras match exitoso (5.2). Requiere `match_status = matched`. Emite evento `AccrualRegistered`.
      x-subpasos:
        - '5.2'
      security:
        - bearerPersonas: []
        - bearerM2M: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador del cruce de 3 vías.
      responses:
        '201':
          description: Devengado registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accrual'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnprocessableEntity'
        '422':
          description: Regla de negocio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                threeWayMatchRequired:
                  value:
                    error_code: THREE_WAY_MATCH_REQUIRED
                    rule: El cruce de 3 vías debe estar en estado matched
                    severity: blocking
                accountingUnavailable:
                  value:
                    error_code: ACCOUNTING_PROVIDER_UNAVAILABLE
                    rule: El proveedor de contabilidad no está disponible
                    severity: blocking
  /accruals/{id}/payment-decree:
