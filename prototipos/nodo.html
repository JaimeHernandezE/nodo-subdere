<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Ficha de un nodo del catálogo: función, instituciones involucradas, madurez y estándar.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<meta property="og:description" content="Ficha de un nodo del catálogo: función, instituciones involucradas, madurez y estándar.">
<meta property="og:url" content="https://jaimehernandeze.github.io/nodo-subdere/nodo.html">

<body>

<div class="alerta"><div class="wrap"><b>Maqueta para revisión.</b> <span id="avisoFicha">Ficha de ejemplo.</span></div></div>

<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html" style="color:#fff"><span>Subdere</span><b>Nodo SUBDERE</b></a>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="que-es.html">Qué es el nodo</a>
    <a href="catalogo.html" aria-current="page">Catálogo</a>
    <a href="participar.html">Cómo participar</a>
    <a href="comentarios.html">Comentarios</a>
  </nav>
</div></header>

<div class="wrap"><p class="miga"><a href="catalogo.html">Catálogo</a> <span id="miga"></span></p></div>

<div id="ficha"></div>

<footer><div class="wrap">
  <div><b>Nodo SUBDERE</b> · Maqueta de trabajo, septiembre de 2026</div>
  <div>Datos semilla: mapeo de nodos del JPL, septiembre de 2026</div>
</div></footer>

<script src="assets/js-yaml.min.js"></script>
<script src="assets/openapi.js"></script>
<script src="assets/data.js"></script>
<script>
(function(){
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var id = new URLSearchParams(location.search).get('id');
  var n = NODOS.filter(function(x){ return x.id === id; })[0];
  var cont = document.getElementById('ficha');

  if(!n){
    cont.innerHTML = '<div class="wrap"><section><h2>Nodo no encontrado</h2>'
      + '<p class="lead">Volver al <a href="catalogo.html">catálogo</a>.</p></section></div>';
    return;
  }

  document.title = n.nombre + ' · Nodo SUBDERE';
  document.getElementById('miga').textContent = '/ ' + n.nombre;

  // Hay estándar ≠ hay servicio alcanzable. Solo división-territorial tiene ambos hoy.
  var tieneArchivo = !!(n.espec && n.espec.archivo);
  var tieneEspec = !!n.espec;
  if (tieneArchivo) {
    document.getElementById('avisoFicha').textContent =
      'Este nodo publica un estándar y se levanta sobre un servicio que ya existe. Lo que no está comprometido es su disponibilidad como nodo.';
  } else if (tieneEspec) {
    document.getElementById('avisoFicha').textContent =
      'Este nodo declara un contrato técnico. Publicar el estándar no significa que el servicio esté expuesto ni que haya ambiente de pruebas.';
  } else {
    document.getElementById('avisoFicha').textContent =
      'Ficha de ejemplo. El estándar técnico y las operaciones de este nodo todavía no están definidos.';
  }

  function pendiente(txt){ return '<div class="pendiente">' + txt + '</div>'; }

  var nota = n.nota ? '<div class="aviso"><p>' + esc(n.nota) + '</p></div>' : '';
  var clase = n.clase || 'intercambio';
  var etiquetaClase = clase === 'plataforma'
    ? '<span class="tag tag-plataforma">Plataforma · no à la carte</span> '
    : '';

  // El estándar no se transcribe: se declara de dónde viene y, si hay archivo local, se renderiza.
  // Ver docs/adr-2026-09-estandar-legible-por-maquina.md
  var estandar;
  if (!tieneEspec) {
    estandar = pendiente('Pendiente. Acá va el contrato técnico del nodo: qué datos se intercambian, en qué formato, con qué operaciones y con qué versión. Se publica antes de que exista implementación, y se versiona aparte de esta ficha.');
  } else {
    estandar = '<dl class="contrato">'
      + '<dt>Formato</dt><dd>' + esc(n.espec.formato)
        + (n.espec.validador
          ? ' · <a href="' + esc(n.espec.validador) + '" rel="noopener">esquema del formato</a>'
          : '')
        + '</dd>'
      + (tieneArchivo
          ? '<dt>Archivo</dt><dd><a href="' + esc(n.espec.archivo) + '" rel="noopener"><code>'
            + esc(n.espec.archivo.split('/').pop()) + '</code></a></dd>'
          : '<dt>Archivo</dt><dd>La especificación vive fuera de esta maqueta; el catálogo no la copia. Ver origen.</dd>')
      + '<dt>Registrada</dt><dd>' + esc(n.espec.registrada) + '</dd>'
      + '<dt>Acceso</dt><dd>' + esc(n.espec.acceso) + '</dd>'
      + '</dl>'
      + '<div class="aviso aviso-neutro"><p>' + esc(n.espec.origen) + '</p></div>';
  }

  var operaciones;
  if (tieneArchivo) {
    operaciones = '<p class="lead-op">Lo que sigue se lee del archivo de la especificación cada vez que se abre esta página. El catálogo no guarda una copia de las operaciones.</p>'
      + '<div id="ops"><p class="sin-params">Leyendo la especificación…</p></div>';
  } else if (tieneEspec) {
    operaciones = pendiente('Las operaciones no se transcriben en el catálogo. Se leen del archivo de la especificación cuando hay un bundle local o el renderizador pueda ensamblar referencias externas. Mientras tanto, el origen del contrato está arriba.');
  } else {
    operaciones = pendiente('Pendiente. Las primeras operaciones candidatas son de consulta y validación, no transaccionales.');
  }

  var pruebas = n.pruebas
    ? '<p>' + esc(n.pruebas) + '</p>'
    : pendiente('Pendiente. Cualquiera podrá construir contra el ambiente de pruebas sin convenio y sin datos reales, antes de solicitar acceso.');

  cont.innerHTML =
    '<div class="wrap"><div class="ficha-cab">'
    + etiquetaClase
    + '<span class="tag tag-ambito">' + esc(n.ambito) + '</span>'
    + '<h1>' + esc(n.nombre) + '</h1>'
    + '<p class="func">' + esc(n.funcion) + '</p>'
    + '</div>'

    + '<div class="ficha-grid"><div>'
    + '<h2>Qué resuelve</h2><p>' + esc(n.descripcion) + '</p>'
    + nota
    + '<h2>Estándar publicado</h2>' + estandar
    + '<h2>Operaciones</h2>' + operaciones
    + '<h2>Ambiente de pruebas</h2>' + pruebas
    + '</div>'

    + '<aside class="panel"><dl>'
    + '<dt>Clase</dt><dd>' + (clase === 'plataforma'
        ? 'Plataforma — condición de otros; no se elige à la carte'
        : 'Intercambio — módulo o canal de datos') + '</dd>'
    + '<dt>Estado de madurez</dt><dd><span class="' + (n.madurez === 'En desarrollo' ? 'tag tag-dev' : 'tag tag-mad') + '">' + esc(n.madurez) + '</span></dd>'
    + '<dt>Factibilidad</dt><dd>' + esc(n.factibilidad) + '</dd>'
    + '<dt>Tipo de intercambio</dt><dd>' + esc(n.intercambio) + '</dd>'
    + '<dt>Instituciones involucradas</dt><dd><ul>'
    + n.instituciones.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('')
    + '</ul></dd>'
    + '<dt>Origen</dt><dd>' + esc(n.origen) + '</dd>'
    + '<dt>Última revisión</dt><dd>15 de septiembre de 2026</dd>'
    + '</dl></aside></div></div>';

  if (!tieneArchivo) return;

  var destino = document.getElementById('ops');
  fetch(n.espec.archivo)
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){ destino.innerHTML = OpenAPI.render(jsyaml.load(txt)); })
    .catch(function(e){
      destino.innerHTML = '<div class="pendiente">'
        + 'No se pudo leer la especificación (' + esc(e.message) + ').<br><br>'
        + 'Si abriste la página con doble clic, es esperable: el navegador no deja que un '
        + 'archivo local lea otro archivo del disco. Sirve la carpeta para verlo '
        + '(<code>python -m http.server</code>) o abre '
        + '<a href="' + esc(n.espec.archivo) + '">la especificación</a> directamente.'
        + '</div>';
    });
})();</script>
</body>
</html>
