<body>

<div class="alerta"><div class="wrap"><b>Maqueta para revisión.</b> <span id="avisoFicha">Ficha de ejemplo.</span></div></div>

<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html" style="color:#fff"><span>Subdere</span><b>Nodo SUBDERE</b></a>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="que-es.html">Qué es el nodo</a>
    <a href="catalogo.html" aria-current="page">Catálogo</a>
    <a href="participar.html">Cómo participar</a>
    <a href="comentarios.html">Comentarios</a>
  </nav>
</div></header>

<div class="wrap"><p class="miga"><a href="catalogo.html">Catálogo</a> <span id="miga"></span></p></div>

<div id="ficha"></div>

<footer><div class="wrap">
  <div><b>Nodo SUBDERE</b> · Maqueta de trabajo, septiembre de 2026</div>
  <div>Datos semilla: mapeo de nodos del JPL, septiembre de 2026</div>
</div></footer>

<script src="assets/data.js"></script>
<script>
(function(){
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var id = new URLSearchParams(location.search).get('id');
  var n = NODOS.filter(function(x){ return x.id === id; })[0];
  var cont = document.getElementById('ficha');

  if(!n){
    cont.innerHTML = '<div class="wrap"><section><h2>Nodo no encontrado</h2>'
      + '<p class="lead">Volver al <a href="catalogo.html">catálogo</a>.</p></section></div>';
    return;
  }

  document.title = n.nombre + ' · Nodo SUBDERE';
  document.getElementById('miga').textContent = '/ ' + n.nombre;
  document.getElementById('avisoFicha').textContent = n.estandar
    ? 'Este nodo se levanta sobre un servicio que ya existe, así que su estándar es real. Lo que no está comprometido es su disponibilidad como nodo.'
    : 'Ficha de ejemplo. El estándar técnico y las operaciones de este nodo todavía no están definidos.';

  var nota = n.nota
    ? '<div class="aviso"><p>' + esc(n.nota) + '</p></div>' : '';

  // Los tres bloques del contrato técnico. Si el nodo no los trae, queda el pendiente.
  function pendiente(txt){ return '<div class="pendiente">' + txt + '</div>'; }

  var estandar = n.estandar
    ? '<p>' + esc(n.estandar.resumen) + '</p>'
      + '<dl class="contrato">'
      + '<dt>Formato</dt><dd>' + esc(n.estandar.formato) + '</dd>'
      + '<dt>Versión</dt><dd>' + esc(n.estandar.version) + '</dd>'
      + '<dt>Ruta base</dt><dd><code>' + esc(n.estandar.base) + '</code></dd>'
      + '<dt>Acceso</dt><dd>' + esc(n.estandar.autenticacion) + '</dd>'
      + '</dl>'
    : pendiente('Pendiente. Acá va el contrato técnico del nodo: qué datos se intercambian, en qué formato, con qué operaciones y con qué versión. Se publica antes de que exista implementación, y se versiona aparte de esta ficha.');

  var operaciones = n.operaciones && n.operaciones.length
    ? '<div class="tabla-ancha"><table><tr><th>Operación</th><th>Qué devuelve</th></tr>'
      + n.operaciones.map(function(o){
          return '<tr><td><code>' + esc(o.metodo) + ' ' + esc(o.ruta) + '</code></td>'
               + '<td>' + esc(o.que) + '</td></tr>';
        }).join('')
      + '</table></div>'
    : pendiente('Pendiente. Las primeras operaciones candidatas son de consulta y validación, no transaccionales.');

  var pruebas = n.pruebas
    ? '<p>' + esc(n.pruebas) + '</p>'
    : pendiente('Pendiente. Cualquiera podrá construir contra el ambiente de pruebas sin convenio y sin datos reales, antes de solicitar acceso.');

  cont.innerHTML =
    '<div class="wrap"><div class="ficha-cab">'
    + '<span class="tag tag-ambito">' + esc(n.ambito) + '</span>'
    + '<h1>' + esc(n.nombre) + '</h1>'
    + '<p class="func">' + esc(n.funcion) + '</p>'
    + '</div>'

    + '<div class="ficha-grid"><div>'
    + '<h2>Qué resuelve</h2><p>' + esc(n.descripcion) + '</p>'
    + nota
    + '<h2>Estándar publicado</h2>' + estandar
    + '<h2>Operaciones</h2>' + operaciones
    + '<h2>Ambiente de pruebas</h2>' + pruebas
    + '</div>'

    + '<aside class="panel"><dl>'
    + '<dt>Estado de madurez</dt><dd><span class="tag tag-mad">' + esc(n.madurez) + '</span></dd>'
    + '<dt>Factibilidad</dt><dd>' + esc(n.factibilidad) + '</dd>'
    + '<dt>Tipo de intercambio</dt><dd>' + esc(n.intercambio) + '</dd>'
    + '<dt>Instituciones involucradas</dt><dd><ul>'
    + n.instituciones.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('')
    + '</ul></dd>'
    + '<dt>Origen</dt><dd>' + esc(n.origen) + '</dd>'
    + '<dt>Última revisión</dt><dd>8 de septiembre de 2026</dd>'
    + '</dl></aside></div></div>';
})();
</script>
</body>
</html>
