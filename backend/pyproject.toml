[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nodo-subdere-backend"
version = "0.1.0"
description = "API del Nodo SUBDERE: catálogo de intercambios, servicios y wiki"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.18,<4",
    "drf-spectacular>=0.30,<0.31",
    "drf-spectacular-sidecar>=2026.10.1",
    "whitenoise>=6.12,<7",
    "django-environ>=0.14,<0.15",
    "django-cors-headers>=4.9,<5",
    "psycopg[binary]>=3.3,<4",
    "PyJWT>=2.15,<3",
    "cryptography>=50",
    "gunicorn>=26,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DJ"]
# Las excepciones del dominio se nombran en español (FuenteNoDisponible, CampoDeFicha):
# el sufijo "Error" que pide N818 no calza.
ignore = ["N818"]

[tool.ruff.format]
# Los bloques de código de la documentación están alineados a mano para leerse como tabla.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"config/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["apps"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
