# Producción oculta. Uso:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  db:
    ports: !reset []
    restart: unless-stopped

  api:
    build:
      args:
        EXTRAS: ""
    command: !reset null
    volumes: !reset []
    restart: unless-stopped
